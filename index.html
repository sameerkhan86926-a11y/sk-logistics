<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
<title>SK LOGISTICS | Transport Management</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  --navy: #090e17;
  --accent: #2563eb;
  --success: #059669;
  --danger: #dc2626;
  --warning: #d97706;
  --bg: #f8fafc;
  --border: #e2e8f0;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:#0f172a;line-height:1.5;padding-bottom:80px}
button,input,select,textarea{font-family:inherit}

.topbar{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.brand{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.topbar-actions{display:flex;gap:6px}

.container{max-width:1200px;margin:auto;padding:14px}
.nav-tabs{display:flex;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
.nav-tab{background:#fff;border:1px solid var(--border);color:#64748b;padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.nav-tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}

.bottom-bar{position:fixed;bottom:0;left:0;right:0;height:60px;background:#fff;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;z-index:1000}
.b-btn{background:transparent;border:0;color:#64748b;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;flex:1}
.b-btn i{font-size:17px}
.b-btn.active{color:var(--accent)}

.page{display:none}
.page.active{display:block}

.panel{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px}
.panel-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px}
.panel-title{font-size:15px;font-weight:700}

.grid-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.kpi-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px;border-left:4px solid var(--accent)}
.kpi-card.profit{border-left-color:var(--success)}
.kpi-card.alert{border-left-color:var(--danger)}
.kpi-card.warning{border-left-color:var(--warning)}
.kpi-label{font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase}
.kpi-val{font-size:18px;font-weight:800;margin-top:4px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;border:1px solid transparent;background:var(--accent);color:#fff}
.btn.secondary{background:#fff;border-color:var(--border);color:#0f172a}
.btn.danger{background:#fef2f2;color:var(--danger);border-color:#fecaca}
.btn.sm{padding:5px 8px;font-size:11px}

.form-grid{display:grid;grid-template-columns:1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:600;color:#334155}
.field input,.field select,.field textarea{border:1px solid var(--border);border-radius:8px;padding:9px;font-size:14px;background:#fff;width:100%}
.field.full{grid-column:1/-1}

.trip-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.trip-head{display:flex;justify-content:space-between;align-items:center}
.trip-route{font-weight:700;font-size:13px}
.trip-metrics{display:grid;grid-template-columns:repeat(3,1fr);background:#f8fafc;padding:6px;border-radius:6px;text-align:center;font-size:12px}
.trip-metrics span{display:block;font-size:9.5px;color:#64748b;text-transform:uppercase}
.trip-actions{display:flex;gap:6px;flex-wrap:wrap;border-top:1px dashed var(--border);padding-top:8px}
.trip-actions .btn{flex:1;min-width:60px}

.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:2000;padding:16px}
.modal.active{display:flex}
.modal-box{background:#fff;border-radius:10px;width:100%;max-width:400px;padding:16px}

.toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-50px);background:var(--navy);color:#fff;padding:8px 16px;border-radius:20px;font-size:12px;font-weight:600;z-index:9999;opacity:0;transition:all .2s ease;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}

@media(min-width:768px){
  body{padding-bottom:0}
  .bottom-bar{display:none}
  .form-grid{grid-template-columns:repeat(3,1fr)}
  .grid-cards{grid-template-columns:repeat(4,1fr)}
}
@media print{
  body *{visibility:hidden!important}
  #printStation, #printStation *{visibility:visible!important}
  #printStation{position:absolute;left:0;top:0;width:100%;display:block!important}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><i class="fa-solid fa-truck"></i> SK LOGISTICS</div>
  <div class="topbar-actions">
    <button class="btn danger sm" id="btnHardReset" title="Fix Frozen App"><i class="fa-solid fa-rotate"></i> Reset Storage</button>
    <button class="btn sm" id="btnQuickAdd"><i class="fa-solid fa-plus"></i> New Trip</button>
  </div>
</header>

<main class="container">
  <nav class="nav-tabs">
    <button class="nav-tab active" data-tab="dashboard">Dashboard</button>
    <button class="nav-tab" data-tab="bookings">Bookings</button>
    <button class="nav-tab" data-tab="newBooking">New Trip</button>
    <button class="nav-tab" data-tab="accounts">Hisab-Kitab</button>
  </nav>

  <!-- DASHBOARD -->
  <section id="page_dashboard" class="page active">
    <div class="grid-cards">
      <div class="kpi-card"><div class="kpi-label">Total Trips</div><div class="kpi-val" id="kpiTotal">0</div></div>
      <div class="kpi-card warning"><div class="kpi-label">Active Trips</div><div class="kpi-val" id="kpiActive">0</div></div>
      <div class="kpi-card profit"><div class="kpi-label">Est. Profit</div><div class="kpi-val" id="kpiProfit">₹0</div></div>
      <div class="kpi-card alert"><div class="kpi-label">Party Due</div><div class="kpi-val" id="kpiDue">₹0</div></div>
    </div>
    <div class="panel">
      <div class="panel-h"><div class="panel-title">Recent Trips</div></div>
      <div id="recentTripsContainer"></div>
    </div>
  </section>

  <!-- BOOKINGS -->
  <section id="page_bookings" class="page">
    <div class="panel">
      <div class="panel-h">
        <div class="panel-title">All Transport Trips</div>
        <input type="text" id="tripSearchInput" placeholder="Search LR, Party, Route..." style="border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:13px">
      </div>
      <div id="allTripsContainer"></div>
    </div>
  </section>

  <!-- NEW/EDIT TRIP -->
  <section id="page_newBooking" class="page">
    <div class="panel">
      <div class="panel-h"><div class="panel-title" id="formHeaderTitle">New Consignment Form</div></div>
      <form id="tripEntryForm">
        <input type="hidden" id="f_id">
        <div class="form-grid">
          <div class="field"><label>Booking Date *</label><input type="date" id="f_date" required></div>
          <div class="field"><label>Party Name *</label><input type="text" id="f_customer" placeholder="Customer name" required></div>
          <div class="field"><label>Party Mobile</label><input type="tel" id="f_phone" placeholder="WhatsApp / Phone"></div>
          <div class="field"><label>Pickup City *</label><input type="text" id="f_pickup" placeholder="From city" required></div>
          <div class="field"><label>Drop City *</label><input type="text" id="f_drop" placeholder="To city" required></div>
          <div class="field"><label>Material / Cargo *</label><input type="text" id="f_goods" placeholder="Goods description" required></div>
          <div class="field"><label>Vehicle No.</label><input type="text" id="f_truck" placeholder="HR55AB1234" style="text-transform:uppercase"></div>
          <div class="field"><label>Trip Status</label>
            <select id="f_status">
              <option value="Booked">Booked</option>
              <option value="In Transit">In Transit</option>
              <option value="Delivered">Delivered</option>
              <option value="Cancelled">Cancelled</option>
            </select>
          </div>
          <div class="field"><label>Customer Freight (₹) *</label><input type="number" id="f_freight" value="0" min="0" required></div>
          <div class="field"><label>Truck Hire Cost (₹)</label><input type="number" id="f_ownerFreight" value="0" min="0"></div>
          <div class="field"><label>Advance Received (₹)</label><input type="number" id="f_received" value="0" min="0"></div>
          <div class="field"><label>Expenses (₹)</label><input type="number" id="f_expenses" value="0" min="0"></div>
        </div>
        <div style="display:flex;gap:10px;margin-top:14px">
          <button type="submit" class="btn" style="flex:1" id="btnSubmitForm">Save Trip</button>
          <button type="button" class="btn secondary" id="btnResetForm">Clear</button>
        </div>
      </form>
    </div>
  </section>

  <!-- HISAB-KITAB -->
  <section id="page_accounts" class="page">
    <div class="panel">
      <div class="panel-h"><div class="panel-title" style="color:var(--danger)">Pending Customer Recoveries</div></div>
      <div id="duesContainer"></div>
    </div>
  </section>
</main>

<nav class="bottom-bar">
  <button class="b-btn active" data-tab="dashboard"><i class="fa-solid fa-chart-pie"></i><span>Home</span></button>
  <button class="b-btn" data-tab="bookings"><i class="fa-solid fa-list"></i><span>Trips</span></button>
  <button class="b-btn" data-tab="newBooking"><i class="fa-solid fa-circle-plus" style="font-size:22px;color:var(--accent)"></i><span>Add</span></button>
  <button class="b-btn" data-tab="accounts"><i class="fa-solid fa-scale-balanced"></i><span>Hisab</span></button>
</nav>

<div class="modal" id="qrModal">
  <div class="modal-box" style="text-align:center">
    <h3 style="margin-bottom:10px">Scan & Pay via UPI</h3>
    <div id="qrBox" style="margin:12px auto;min-height:160px;display:flex;align-items:center;justify-content:center"></div>
    <h4 id="qrAmtText" style="color:var(--accent);margin-bottom:12px">₹0</h4>
    <button class="btn secondary" style="width:100%" id="btnCloseQr">Close</button>
  </div>
</div>

<div class="toast" id="toastBox">Notification</div>
<div id="printStation" style="display:none"></div>

<script>
// PURE FAIL-SAFE STORAGE SYSTEM
const STORAGE_KEY = "sk_logistics_v5_live";
let trips = [];

function getToday() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function parseN(val) {
  const n = parseFloat(val);
  return (!isNaN(n) && n >= 0) ? n : 0;
}

function inr(val) {
  return "₹" + parseN(val).toLocaleString("en-IN");
}

function calcDue(t) {
  return Math.max(0, parseN(t.freight) - parseN(t.received));
}

function calcProfit(t) {
  return parseN(t.freight) - parseN(t.ownerFreight) - parseN(t.expenses);
}

function showToast(msg) {
  const t = document.getElementById("toastBox");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    trips = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(trips)) trips = [];
  } catch (e) {
    trips = [];
  }
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(trips));
  } catch (e) {
    alert("Phone storage full!");
  }
}

// NAVIGATION
function switchPage(pageName) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".nav-tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".b-btn").forEach(b => b.classList.remove("active"));

  const targetPage = document.getElementById("page_" + pageName);
  if (targetPage) targetPage.classList.add("active");

  const tabBtn = document.querySelector(`.nav-tab[data-tab="${pageName}"]`);
  if (tabBtn) tabBtn.classList.add("active");

  const bBtn = document.querySelector(`.b-btn[data-tab="${pageName}"]`);
  if (bBtn) bBtn.classList.add("active");

  if (pageName === "newBooking" && !document.getElementById("f_id").value) {
    document.getElementById("f_date").value = getToday();
  }

  renderAll();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// RENDERERS
function renderCards(list, elementId) {
  const el = document.getElementById(elementId);
  if (!el) return;

  if (!list.length) {
    el.innerHTML = `<div style="text-align:center;padding:24px;color:#64748b;font-size:13px">No trips found.</div>`;
    return;
  }

  el.innerHTML = list.map(t => `
    <div class="trip-card">
      <div class="trip-head">
        <strong style="color:var(--accent);font-family:monospace">${t.lr}</strong>
        <span style="font-weight:700;font-size:11px">${t.status}</span>
      </div>
      <div style="font-weight:700;font-size:14px">${t.customer}</div>
      <div class="trip-route">${t.pickup} ➔ ${t.drop}</div>
      <div style="font-size:12px;color:#64748b">${t.truck || 'No Vehicle'} · ${t.goods}</div>
      <div class="trip-metrics">
        <div><span>Freight</span><strong>${inr(t.freight)}</strong></div>
        <div><span>Party Due</span><strong style="color:${calcDue(t) > 0 ? 'var(--danger)' : 'var(--success)'}">${inr(calcDue(t))}</strong></div>
        <div><span>Profit</span><strong style="color:${calcProfit(t) >= 0 ? 'var(--success)' : 'var(--danger)'}">${inr(calcProfit(t))}</strong></div>
      </div>
      <div class="trip-actions">
        ${calcDue(t) > 0 ? `<button class="btn sm" data-qr="${t.id}"><i class="fa-solid fa-qrcode"></i> Pay QR</button>` : ''}
        ${t.phone ? `<a href="tel:${t.phone}" class="btn secondary sm"><i class="fa-solid fa-phone"></i> Call</a>` : ''}
        <button class="btn secondary sm" data-print="${t.id}"><i class="fa-solid fa-print"></i> Bilti</button>
        <button class="btn secondary sm" data-edit="${t.id}"><i class="fa-solid fa-pen"></i> Edit</button>
        <button class="btn danger sm" data-del="${t.id}"><i class="fa-solid fa-trash"></i></button>
      </div>
    </div>
  `).join("");
}

function renderAll() {
  document.getElementById("kpiTotal").textContent = trips.length;
  document.getElementById("kpiActive").textContent = trips.filter(t => t.status === "Booked" || t.status === "In Transit").length;
  document.getElementById("kpiProfit").textContent = inr(trips.reduce((acc, t) => acc + calcProfit(t), 0));
  document.getElementById("kpiDue").textContent = inr(trips.reduce((acc, t) => acc + calcDue(t), 0));

  renderCards(trips.slice(0, 5), "recentTripsContainer");

  const query = (document.getElementById("tripSearchInput")?.value || "").toLowerCase();
  const filtered = trips.filter(t => [t.lr, t.customer, t.pickup, t.drop, t.truck, t.goods].some(x => String(x || "").toLowerCase().includes(query)));
  renderCards(filtered, "allTripsContainer");

  const dues = trips.filter(t => calcDue(t) > 0);
  const duesEl = document.getElementById("duesContainer");
  if (duesEl) {
    duesEl.innerHTML = dues.length ? dues.map(t => `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)">
        <div>
          <strong>${t.customer}</strong>
          <div style="font-size:11px;color:#64748b">${t.lr} · ${t.pickup} ➔ ${t.drop}</div>
        </div>
        <div style="text-align:right">
          <strong style="color:var(--danger)">${inr(calcDue(t))}</strong><br>
          <button class="btn secondary sm" data-pay="${t.id}" style="margin-top:3px">Collect</button>
        </div>
      </div>
    `).join("") : `<div style="padding:16px;color:#64748b;font-size:13px">All accounts cleared!</div>`;
  }
}

// FORM SUBMIT
document.getElementById("tripEntryForm").addEventListener("submit", function(e) {
  e.preventDefault();
  const editId = document.getElementById("f_id").value;
  const payload = {
    date: document.getElementById("f_date").value,
    customer: document.getElementById("f_customer").value.trim(),
    phone: document.getElementById("f_phone").value.trim(),
    pickup: document.getElementById("f_pickup").value.trim(),
    drop: document.getElementById("f_drop").value.trim(),
    goods: document.getElementById("f_goods").value.trim(),
    truck: document.getElementById("f_truck").value.trim().toUpperCase(),
    status: document.getElementById("f_status").value,
    freight: parseN(document.getElementById("f_freight").value),
    ownerFreight: parseN(document.getElementById("f_ownerFreight").value),
    received: parseN(document.getElementById("f_received").value),
    expenses: parseN(document.getElementById("f_expenses").value)
  };

  if (editId) {
    const idx = trips.findIndex(t => String(t.id) === String(editId));
    if (idx !== -1) {
      payload.id = editId;
      payload.lr = trips[idx].lr;
      trips[idx] = payload;
      showToast("Trip updated!");
    }
  } else {
    payload.id = "TRIP_" + Date.now();
    payload.lr = "SKL-" + getToday().replace(/-/g, "") + "-" + String(trips.length + 1).padStart(4, "0");
    trips.unshift(payload);
    showToast("LR Created: " + payload.lr);
  }

  saveData();
  resetEntryForm();
  switchPage("bookings");
});

function resetEntryForm() {
  document.getElementById("tripEntryForm").reset();
  document.getElementById("f_id").value = "";
  document.getElementById("f_date").value = getToday();
  document.getElementById("formHeaderTitle").textContent = "New Consignment Form";
  document.getElementById("btnSubmitForm").textContent = "Save Trip";
}

// GUARANTEED GLOBAL EVENT DELEGATION
document.addEventListener("click", function(e) {
  const tabBtn = e.target.closest("[data-tab]");
  if (tabBtn) {
    switchPage(tabBtn.getAttribute("data-tab"));
    return;
  }

  const editBtn = e.target.closest("[data-edit]");
  if (editBtn) {
    const id = editBtn.getAttribute("data-edit");
    const t = trips.find(x => String(x.id) === String(id));
    if (!t) return;
    document.getElementById("f_id").value = t.id;
    document.getElementById("f_date").value = t.date || getToday();
    document.getElementById("f_customer").value = t.customer || "";
    document.getElementById("f_phone").value = t.phone || "";
    document.getElementById("f_pickup").value = t.pickup || "";
    document.getElementById("f_drop").value = t.drop || "";
    document.getElementById("f_goods").value = t.goods || "";
    document.getElementById("f_truck").value = t.truck || "";
    document.getElementById("f_status").value = t.status || "Booked";
    document.getElementById("f_freight").value = t.freight || 0;
    document.getElementById("f_ownerFreight").value = t.ownerFreight || 0;
    document.getElementById("f_received").value = t.received || 0;
    document.getElementById("f_expenses").value = t.expenses || 0;
    document.getElementById("formHeaderTitle").textContent = "Edit LR: " + t.lr;
    document.getElementById("btnSubmitForm").textContent = "Update Trip";
    switchPage("newBooking");
    return;
  }

  const delBtn = e.target.closest("[data-del]");
  if (delBtn) {
    const id = delBtn.getAttribute("data-del");
    if (confirm("Delete this trip?")) {
      trips = trips.filter(x => String(x.id) !== String(id));
      saveData();
      renderAll();
      showToast("Trip deleted");
    }
    return;
  }

  const printBtn = e.target.closest("[data-print]");
  if (printBtn) {
    const id = printBtn.getAttribute("data-print");
    const t = trips.find(x => String(x.id) === String(id));
    if (!t) return;
    const p = document.getElementById("printStation");
    p.innerHTML = `
      <div style="border:2px solid #000;padding:16px;font-family:sans-serif">
        <h2 style="text-align:center;margin:0">SK LOGISTICS</h2>
        <p style="text-align:center;font-size:12px;margin:2px 0 10px">TRANSPORT BILTI</p>
        <div style="display:flex;justify-content:space-between;margin-bottom:8px">
          <strong>LR: ${t.lr}</strong><span>Date: ${t.date}</span>
        </div>
        <table border="1" cellpadding="6" style="width:100%;border-collapse:collapse;font-size:13px">
          <tr><td>Party: ${t.customer}</td><td>Route: ${t.pickup} ➔ ${t.drop}</td></tr>
          <tr><td>Vehicle: ${t.truck || '-'}</td><td>Goods: ${t.goods}</td></tr>
          <tr><td>Freight: ${inr(t.freight)}</td><td>Due: ${inr(calcDue(t))}</td></tr>
        </table>
        <div style="display:flex;justify-content:space-between;margin-top:40px;font-size:12px">
          <div>Consignor Sign</div><div>Authorized Sign</div>
        </div>
      </div>
    `;
    window.print();
    return;
  }

  const qrBtn = e.target.closest("[data-qr]");
  if (qrBtn) {
    const id = qrBtn.getAttribute("data-qr");
    const t = trips.find(x => String(x.id) === String(id));
    if (!t) return;
    const due = calcDue(t);
    const upiUrl = `upi://pay?pa=sklogistics@upi&pn=SKLogistics&am=${due}&cu=INR`;
    document.getElementById("qrBox").innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(upiUrl)}" style="width:160px;height:160px" alt="QR">`;
    document.getElementById("qrAmtText").textContent = inr(due) + " (" + t.customer + ")";
    document.getElementById("qrModal").classList.add("active");
    return;
  }

  const payBtn = e.target.closest("[data-pay]");
  if (payBtn) {
    const id = payBtn.getAttribute("data-pay");
    const t = trips.find(x => String(x.id) === String(id));
    if (!t) return;
    const amt = prompt("Total amount received so far (₹):", t.received);
    if (amt !== null) {
      t.received = parseN(amt);
      saveData();
      renderAll();
      showToast("Payment updated");
    }
    return;
  }
});

// STATIC BUTTON BINDS
document.getElementById("btnQuickAdd").onclick = () => switchPage("newBooking");
document.getElementById("btnResetForm").onclick = resetEntryForm;
document.getElementById("btnCloseQr").onclick = () => document.getElementById("qrModal").classList.remove("active");

document.getElementById("btnHardReset").onclick = function() {

    localStorage.clear();
    location.reload();
  }
};

resetEntryForm();
renderAll();
